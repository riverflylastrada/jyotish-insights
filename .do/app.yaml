# PWA note: DigitalOcean App Platform static sites do not (yet) expose a
# per-path Cache-Control override in the app spec. This is acceptable because
# (a) browsers re-validate the service worker script (`sw.js`) at most every
# 24h by the SW spec regardless of HTTP caching, and (b) vite-plugin-pwa
# revisions the precache manifest so hashed `/assets/*` URLs change every build.
# The Docker/nginx path (see nginx.conf) sets explicit no-cache headers for
# sw.js / manifest / index.html for self-hosted deploys.
name: jyotish-insights
region: blr
domains:
  - domain: acharyajyotish.com
    type: PRIMARY
  - domain: www.acharyajyotish.com
    type: ALIAS
static_sites:
  - name: jyotish-insights-frontend
    github:
      repo: Viewofmind/jyotish-insights
      branch: main
      deploy_on_push: true
    build_command: npm run build
    output_dir: dist
    error_document: index.html
    envs:
      - key: VITE_SUPABASE_PROJECT_ID
        scope: RUN_AND_BUILD_TIME
        value: "bkdfseyhusoxiruhuhbs"
      - key: VITE_SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://bkdfseyhusoxiruhuhbs.supabase.co"
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrZGZzZXlodXNveGlydWh1aGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTY0MzYsImV4cCI6MjA5NDk3MjQzNn0.hBUfzBDT_MA-eZXZkwQfxoOV4mBN2_jmhHJyA6kvpbo"
      - key: VITE_ASTRO_PROVIDER
        scope: RUN_AND_BUILD_TIME
        value: "custom"
