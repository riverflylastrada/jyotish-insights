name: CI

# Validates every PR (and pushes to main) so regressions — like a dossier test
# drifting from the dossier text — are caught before merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx vitest run
      - run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno tests (engine + dossier)
        run: deno test supabase/functions/calculate-kundli/ supabase/functions/guru-debate/
      - name: Deno type-check entrypoints
        run: deno check supabase/functions/calculate-kundli/engine.ts supabase/functions/guru-debate/index.ts

  # Deploy the edge functions on every push to main, so engine version bumps
  # actually reach production. The frontend already auto-deploys (DigitalOcean,
  # deploy_on_push) — without this, a bumped CURRENT_SNAPSHOT_VERSION ships to
  # the UI while the stamping function stays behind, leaving every saved chart
  # stuck on a "Recalculate" banner that can never clear.
  # Requires repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF;
  # skips cleanly if they are not configured.
  deploy-functions:
    needs: [frontend, edge-functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for deploy credentials
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase deploy secrets not set — skipping function deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.skip != 'true'
        with:
          version: latest
      - name: Deploy edge functions
        if: steps.creds.outputs.skip != 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
